

<div class="product_list">
    <h1>All Product List</h1>
    <p>{{productMsg}}</p>
    <table *ngIf=" ListOfProducts.length > 0">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>color</th>
                <th>Description</th>
                <th>image</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of ListOfProducts">
                <td>{{item.name}}</td>
                <td>{{item.price}}</td>
                <td>{{item.color}}</td>
                <td>{{item.description}}</td>
                <td><img src="{{item.image}}" /></td>
                <td class="font_awesome"><fa-icon (click)="deleteItem(item.id)"  [icon]="icon" ></fa-icon>
                  <a routerLink = "/seller-update-product/{{item.id}}"><fa-icon [icon]="edit"></fa-icon></a>
                </td>

                    
                
            </tr>
        </tbody>
    </table>
</div>
